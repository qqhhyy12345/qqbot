name: astrbot_plugin_sheet_music
desc: 给模型一个 find_sheet_music 工具：报个歌名，去歌谱简谱网找谱图发过来；返回 已发送=1 / 未发送=0 状态码，图片发完即删。
help: |-
  装上后模型多了一个 find_sheet_music 工具：对方要看简谱/曲谱时，它自己去找。

  只在 www.jianpu.cn 站内找（只走 HTTP），不依赖外部搜索引擎。
  站内搜索按单字模糊召回、一页 100 条，结果直接带标题和歌手；点了歌手名的，
  再按歌手搜一遍，还不够就去歌手的作品页（一个人的谱子全列在一页里）翻。

  每个候选都会打开详情页，用标题和「艺术家/歌手」复核，对不上就不发——
  宁可说没找到，也不发一张别人的谱。指定了歌手时，歌手栏对不上的直接作废。

  一首谱有多页时最多发 4 张。超过 1600 宽的缩到 1600 再发，其余原样发不重编码。
  临时文件放 AstrBot temp/sheet_music 下，发完立刻删；进程被硬杀留下的目录，
  下次启动时自动清掉。

  已知限制：站内搜索一页最多 100 条、按上传时间排，歌名全是常见字又不带歌手名时
  （比如「小星星」），目标可能挤不进这一页，只能如实报没找到。带上真正的歌手名
  （「周杰伦 夜曲」）会走歌手作品页，命中很稳。
version: v1.0.0
author: 本地自建
display_name: 曲谱（找谱发图）
short_desc: 报个歌名，递张谱子。
astrbot_version: ">=4.24.0"
