name: astrbot_plugin_singing
desc: 给模型一个 sing 工具，把中文歌词和简谱交给本地 DiffSinger 唱成人声，以语音消息发出；渲染在独立子进程里跑，发完即删。
help: |-
  装上后模型多了一个 sing 工具：对方给得出歌词和简谱、又明确要你唱时才会用。

  简谱写法：1-7 对应 do-si，空格分隔，一个字一个音；`-` 表示前一个音延长一拍；
  `#` / `b` 升降半音，`'` / `,` 升降八度；1 = C4，速度固定 120 BPM。

  例：歌词「一闪一闪亮晶晶满天都是小星星」
      简谱「1 1 5 5 6 6 5 - 4 4 3 3 2 2 1 -」

  返回 已发送=1 表示已发出去（模型不必再确认），未发送=0（原因）表示没唱成、改用文字。
  渲染用 _uv_tools/singing/.venv 的子进程，不污染 AstrBot 的 Python 环境；
  合成出来的 mp3 放在 AstrBot temp 里，发送后立刻删除。

  只支持中文歌词。QQ 语音消息有 60 秒上限，超了会拒唱。
version: v1.0.0
author: 本地自建
display_name: 唱歌（DiffSinger）
short_desc: 给她一副能唱歌的嗓子。
astrbot_version: ">=4.24.0"
